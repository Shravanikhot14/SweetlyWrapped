<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Sweetly Wrapped</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon"> <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Comic+Relief:wght@400;700&family=Roboto:wght@100..900&family=Rubik:wght@300..900&display=swap"
        rel="stylesheet">
</head>

<body> <!-- Header -->
    <header>
        <nav>
            <div> <img src="images/logo.png" alt="Sweetly Wrapped Logo" width="180px" title="Sweetly Wrapped Logo">
                <ul id="navMenu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="occasions.html">Occasions</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="personalized.html">Personalized</a></li>
                    <li><a href="aboutus.html">About Us</a></li>
                    <li> <a href="login.html"> Login </a> </li>
                </ul>
            </div>
        </nav>
    </header> <!-- Signup Section -->
    <div class="signup-container">
        <div class="signup-box">
            <h1>Create Account</h1>
            <p class="subtitle"> Join Sweetly Wrapped and start gifting! </p>
            <form> 
                
                <label for="name"> Full Name </label> 
                <input type="text" id="name" placeholder="Enter your full name" required> 
                <label for="email"> Email </label> <input type="email" id="email" placeholder="Enter your email" required>
                <label for="password"> Password </label> 
                <input type="password" id="password" placeholder="Create a password" required> 
                <label for="confirm-password"> Confirm Password </label> 
                <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                <button type="submit"> Sign Up </button> 
            </form>
            <p class="login"> Already have an account? <a href="login.html"> Login </a> </p>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
