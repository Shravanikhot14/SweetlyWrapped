    <link rel="shortcut icon" href="images/logo.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

    <header>
        <nav>
            <div>

                <img src="images/logo.png" alt="Logo" width="180px" title="sweetly wrapped logo">


                <ul id="navMenu">

    <div class="login-container">
        <div class="login-box">
            <h1>Welcome Back!</h1>
            <p class="subtitle">Login to continue your gifting journey</p>
            <form>
                <label for="email">Email</label> <input type="email" id="email" placeholder="Enter your email" required>
                <label for="password">Password</label> <input type="password" id="password"
                    placeholder="Enter your password" required>
                <div class="options">
                    <label class="remember"> <input type="checkbox"> Remember me </label> <a href="#">Forgot
                        Password?</a>
                </div>
                <button type="submit">Login</button>
            </form>
            <p class="signup"> Don't have an account? <a href="signup.html">Sign Up</a> </p>
        </div>
    </div>
